# Publica o FRONTEND no GitHub Pages a cada push na branch main.
# Configure em: Settings → Pages → Source: "GitHub Actions"
# e em Settings → Secrets and variables → Actions → Variables:
#   VITE_API_URL           (ex.: https://api.seudominio.com.br/api)   ← URL pública (https) da API Laravel
#   VITE_GOOGLE_CLIENT_ID  (opcional, para o login com Google)
name: Deploy frontend (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run validate:content
      - name: Build
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          # repositório "usuario.github.io" publica na raiz; os demais, em /nome-do-repositorio/
          case "$REPO" in *.github.io) export VITE_BASE="/" ;; *) export VITE_BASE="/$REPO/" ;; esac
          npm run build
          cp dist/index.html dist/404.html   # links diretos (ex.: /jogos/rotina) voltam para o app
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
